# =========================================================
# BaCay Server Configuration — server.properties
# =========================================================
# File này là MẪU để commit. Sao chép thành server.properties
# và điền giá trị thực tế. KHÔNG commit file chứa mật khẩu DB.
# =========================================================

# --- Mạng ---
# Cổng lắng nghe (mặc định 8888, override: -Dserver.port=XXXX)
server.port=8888

# Số kết nối tối đa đồng thời
server.maxConnections=100

# Kích thước hàng đợi backlog của ServerSocket
server.backlog=50

# --- Heartbeat (N06) ---
# Server gửi PING mỗi X giây
heartbeat.intervalSeconds=5

# Coi mất kết nối nếu không nhận PONG sau X giây kể từ PING
heartbeat.timeoutSeconds=15

# --- Chat (N07) ---
# Độ dài tối đa một tin nhắn (ký tự)
chat.maxLength=500

# Giới hạn tần suất: tối đa N tin trong M giây
chat.rateLimit.maxMessages=5
chat.rateLimit.windowSeconds=10

# Bật lưu lịch sử chat vào DB (mặc định false)
chat.enableLog=false

# --- Phân trang ---
pagination.defaultPageSize=20
pagination.maxPageSize=100

# --- Database (Nhật cấu hình — KHÔNG commit giá trị thật) ---
# db.url=jdbc:postgresql://localhost:5432/bacaudb
# db.username=YOUR_DB_USER
# db.password=YOUR_DB_PASSWORD
# db.poolSize=10

# --- Logging ---
# Xem logback.xml để cấu hình chi tiết

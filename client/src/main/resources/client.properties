# =========================================================
# BaCay Client Configuration — client.properties
# =========================================================
# File này được commit vì không chứa thông tin nhạy cảm.
# Override tại runtime: -Dserver.host=IP -Dserver.port=PORT
# =========================================================

# --- Địa chỉ server ---
# KHÔNG gắn IP máy cá nhân vào đây — để localhost hoặc để UI cho nhập
server.host=localhost
server.port=8888

# --- Kết nối ---
# Timeout kết nối tới server (milli giây)
connection.timeoutMs=5000

# --- UI ---
# Độ dài tối đa ô nhập chat (phải khớp với server.chat.maxLength)
chat.maxLength=500
